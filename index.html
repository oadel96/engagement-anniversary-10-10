<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>The Story of Us</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💛</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>

  <!-- Intro -->
  <section id="intro" class="screen">
    <div class="intro-inner">
      <p class="eyebrow reveal" id="date"></p>
      <h1 class="reveal" id="title"></h1>
      <p class="names reveal" id="names"></p>
      <div class="stats reveal" id="stats"></div>
      <button id="start" class="btn reveal">Begin</button>
    </div>
    <div class="scroll-hint">scroll</div>
  </section>

  <!-- Route map -->
  <section id="journey">
    <header class="section-head reveal">
      <p class="eyebrow">Chapter one</p>
      <h2>Our route</h2>
      <p class="lede" id="distance-line"></p>
    </header>
    <div class="map-wrap reveal">
      <div id="map"></div>
      <button id="tour" class="btn btn-float">Follow our route</button>
      <article id="card" class="card" hidden>
        <button class="card-close" aria-label="Close">&times;</button>
        <div class="card-photo"><img alt=""></div>
        <div class="card-body">
          <p class="card-meta"><span class="card-num"></span><span class="card-date"></span></p>
          <h3 class="card-title"></h3>
          <p class="card-text"></p>
          <p class="card-countdown" hidden></p>
          <nav class="card-nav">
            <button class="card-prev" aria-label="Previous">&larr;</button>
            <span class="card-count"></span>
            <button class="card-next" aria-label="Next">&rarr;</button>
          </nav>
        </div>
      </article>
    </div>
  </section>

  <!-- Polaroid wall -->
  <section id="memories">
    <header class="section-head reveal">
      <p class="eyebrow">Chapter two</p>
      <h2>Our wall</h2>
      <p class="lede" id="wall-hint"></p>
    </header>
    <div id="wall"></div>
  </section>

  <!-- Ending -->
  <section id="ending" class="screen">
    <div class="ending-inner">
      <p class="eyebrow reveal">Always</p>
      <div id="message"></div>
      <p class="signature reveal" id="signature"></p>
    </div>
    <div class="hearts" aria-hidden="true"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
